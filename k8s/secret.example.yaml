# Salin file ini menjadi k8s/secret.yaml (jangan commit ke git), atau buat via kubectl:
#   SECRET=$(openssl rand -hex 32)
#   kubectl create secret generic bps-mcp-codemode-secret \
#     --from-literal=CODEMODE_SHARED_SECRET="$SECRET"
#
# Secret yang sama WAJIB di-set di Cloudflare Worker:
#   printf "%s" "$SECRET" | npx wrangler secret put CODEMODE_SHARED_SECRET
apiVersion: v1
kind: Secret
metadata:
  name: bps-mcp-codemode-secret
  labels:
    app: bps-mcp-codemode
    app.kubernetes.io/name: bps-mcp-codemode
type: Opaque
stringData:
  CODEMODE_SHARED_SECRET: "REPLACE_WITH_OPENSSL_RAND_HEX_32"
