apiVersion: apps/v1
kind: Deployment
metadata:
  name: bps-mcp-codemode
  labels:
    app: bps-mcp-codemode
    app.kubernetes.io/name: bps-mcp-codemode
    app.kubernetes.io/component: codemode-sandbox
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: bps-mcp-codemode
  template:
    metadata:
      labels:
        app: bps-mcp-codemode
        app.kubernetes.io/name: bps-mcp-codemode
        app.kubernetes.io/component: codemode-sandbox
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: bps-mcp-codemode
          image: ghcr.io/setiapam/bps-mcp-server-codemode:latest
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 3000
              protocol: TCP
          env:
            - name: PORT
              value: "3000"
            - name: HOST
              value: "0.0.0.0"
            - name: BPS_DATA_DIR
              value: "/data"
            - name: BPS_LOG_LEVEL
              value: "info"
            - name: CODEMODE_MEMORY_LIMIT_MB
              value: "32"
            - name: CODEMODE_STACK_LIMIT_KB
              value: "512"
            - name: CODEMODE_TIMEOUT_MS
              value: "25000"
            - name: CODEMODE_MAX_CALLS
              value: "30"
            - name: CODEMODE_MAX_OUTPUT_BYTES
              value: "51200"
            - name: CODEMODE_MAX_LOG_BYTES
              value: "4096"
            - name: CODEMODE_MAX_CONCURRENT
              value: "8"
            - name: CODEMODE_SHARED_SECRET
              valueFrom:
                secretKeyRef:
                  name: bps-mcp-codemode-secret
                  key: CODEMODE_SHARED_SECRET
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "384Mi"
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          volumeMounts:
            - name: data
              mountPath: /data
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: bps-mcp-codemode-data
        - name: tmp
          emptyDir:
            sizeLimit: 32Mi
