name: Deploy Workers

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Code Mode backend (k3s) memverifikasi header X-CodeMode-Secret,
      # jadi nilai secret harus identik dengan k8s Secret bps-mcp-codemode-secret.
      - name: Sync CODEMODE_SHARED_SECRET
        run: printf '%s' "$CODEMODE_SHARED_SECRET" | npx wrangler secret put CODEMODE_SHARED_SECRET
        env:
          CODEMODE_SHARED_SECRET: ${{ secrets.CODEMODE_SHARED_SECRET }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
