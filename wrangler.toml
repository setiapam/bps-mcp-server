name = "bps-mcp-server"
main = "src/worker.ts"
compatibility_date = "2025-04-01"
compatibility_flags = ["nodejs_compat"]

[vars]
# By default, try to route directly to BPS WebAPI.
# If blocked by WAF, the worker dynamically switches to the BPS_PROXY_*_BASE_URL.
BPS_API_BASE_URL = "https://webapi.bps.go.id/v1"
BPS_PROXY_API_BASE_URL = "https://bps-api.murphi.my.id/v1"
BPS_ALLSTATS_BASE_URL = "https://searchengine.web.bps.go.id"
BPS_PROXY_ALLSTATS_BASE_URL = "https://bps-api.murphi.my.id/allstats/"
BPS_DEFAULT_LANG = "ind"
BPS_DEFAULT_DOMAIN = "0000"

# Pattern A (Hybrid Worker Free + k3s Homelab) Code Mode proxy:
# Uncomment and set your Cloudflare Tunnel hostname once the k3s backend is deployed,
# then set the shared secret via: npx wrangler secret put CODEMODE_SHARED_SECRET
# CODEMODE_BACKEND_URL = "https://bps-codemode.murphi.my.id"

# KV namespace for BPS data caching
[[kv_namespaces]]
binding = "BPS_CACHE"
id = "847d3de768034a58ba48bc6f637f70df"

# KV namespace for OAuth tokens (required by workers-oauth-provider)
# Create with: wrangler kv namespace create OAUTH_KV
[[kv_namespaces]]
binding = "OAUTH_KV"
id = "be20e5b126b44a35bb99c7f1c0961d14"
